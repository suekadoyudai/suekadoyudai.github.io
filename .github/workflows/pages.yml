name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          mkdir _site
          unzip -q site.zip -d _site
          for z in $(ls arcade-*.zip 2>/dev/null | sort); do
            if unzip -Z1 "$z" | grep -v -E '^arcade/' | grep -q .; then echo "::error::$z has paths outside arcade/"; exit 1; fi
            if unzip -Z1 "$z" | grep -q -E '(^/|\.\./)'; then echo "::error::$z has unsafe paths"; exit 1; fi
            unzip -q -o "$z" -d _site
          done
          ls -la _site _site/.well-known
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Since 2026-11-24 deploy-pages often cannot see the artifact right after the upload
  # ("No artifacts named github-pages were found") and a later re-run passes. The deploy
  # now runs as its own job, waits a moment and retries in the same run before failing.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - name: Let the artifact listing settle
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the first retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the second retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 180
      - id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
